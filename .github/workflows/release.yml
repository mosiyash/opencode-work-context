name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up npm trusted publishing support
        run: npm install --global npm@11

      - name: Verify tag matches package version
        run: node --input-type=module --eval 'import fs from "node:fs"; const manifest = JSON.parse(await fs.promises.readFile("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${manifest.version}`) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${manifest.version}`);'

      - name: Install dependencies
        run: npm ci

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Run test suite
        run: npm test

      - name: Run TUI suite
        run: npm run test:tui

      - name: Check repository language
        run: npm run check:language

      - name: Publish package
        run: npm publish --access public
